# ==============================================================================
# Konfiguration fuer Logitech Racing Wheels (G27 / G29)
# ==============================================================================
# Hier koennen saemtliche Parameter fuer Lenkrad-Motor und Force-Feedback
# angepasst werden. Alternativ koennen die wichtigsten Werte auch direkt per
# Befehlszeilen-Parameter an lct_track.py uebergeben werden:
#   --autocenter 75   (Zentrierfeder in %, z.B. 40=leicht, 75=realistisch/stabil, 90=sehr fest)
#   --ffb-gain 85     (Gesamtkraft des Motors in %, Standard: 85)
#   --wheel-range 900 (Maximaler Lenkwinkel in Grad, z.B. 900 oder 540)
# ==============================================================================

[G27 Racing Wheel]
# Achsen- und Tastenbelegung
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5

# Motor- & Feedback-Parameter:
# 1. Lenkwinkel (in Grad, Standard: 900)
steering_range = 900
# 2. Gesamtmotorkraft (Gain) (0.0 - 1.0 oder 0 - 100, Standard: 85%)
overall_gain = 85
# 3. Hardware-Zentrierfeder (Rückstellmoment) (0.0 - 1.0 oder 0 - 100, Standard: 75%)
autocenter = 75
centering_strength = 75
# 4. Progressive Zentrierkraft um die Nulllage (fester, stabiler Geradeauslauf beim Spurhalten)
center_spring = 55
# 5. Mindestkraft / Anti-Deadzone (ueberwindet das mechanische Totband der Logitech-Zahnraeder)
min_force = 12
# 6. Dynamische Daempfung (verhindert Oszillieren / Schwingen um die Nulllage)
damping_strength = 40
# 7. Grundreibung (verhindert lockeres Spiel und gibt dem Lenkrad realistisches Gewicht)
friction_strength = 20
# 8. Anti-Clipping (Kompression via tanh gegen Motorsaettigung)
anti_clipping = true

[Logitech G27 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5
steering_range = 900
overall_gain = 85
autocenter = 75
centering_strength = 75
center_spring = 55
min_force = 12
damping_strength = 40
friction_strength = 20
anti_clipping = true

[G29 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 5
handbrake = 4
steering_range = 900
overall_gain = 85
autocenter = 75
centering_strength = 75
center_spring = 55
min_force = 12
damping_strength = 40
friction_strength = 20
anti_clipping = true
