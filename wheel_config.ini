# ==============================================================================
# Konfiguration fuer Logitech Racing Wheels (G27 / G29)
# ==============================================================================
# Hier koennen saemtliche Parameter fuer Lenkrad-Motor und Force-Feedback
# angepasst werden. Alternativ koennen die wichtigsten Werte auch direkt per
# Befehlszeilen-Parameter an lct_track.py uebergeben werden:
#   --autocenter 65   (Zentrierfeder in %, z.B. 40=leicht, 65=realistisch, 85=schwer)
#   --ffb-gain 85     (Gesamtkraft des Motors in %, Standard: 85)
#   --wheel-range 900 (Maximaler Lenkwinkel in Grad, z.B. 900 oder 540)
# ==============================================================================

[G27 Racing Wheel]
# Achsen- und Tastenbelegung
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5

# Motor- & Feedback-Parameter:
# 1. Lenkwinkel (in Grad, Standard: 900)
steering_range = 900
# 2. Gesamtmotorkraft (Gain) (0.0 - 1.0 oder 0 - 100, Standard: 85%)
overall_gain = 85
# 3. Hardware-Zentrierfeder (Rückstellmoment) (0.0 - 1.0 oder 0 - 100, Standard: 65%)
autocenter = 65
centering_strength = 65
# 4. Dynamische Daempfung (verhindert Oszillieren / Schwingen um die Nulllage)
damping_strength = 35
# 5. Grundreibung (verhindert lockeres Spiel bei Stillstand)
friction_strength = 15
# 6. Anti-Clipping (Kompression via tanh gegen Motorsaettigung)
anti_clipping = true

[Logitech G27 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5
steering_range = 900
overall_gain = 85
autocenter = 65
centering_strength = 65
damping_strength = 35
friction_strength = 15
anti_clipping = true

[G29 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 5
handbrake = 4
steering_range = 900
overall_gain = 85
autocenter = 65
centering_strength = 65
damping_strength = 35
friction_strength = 15
anti_clipping = true
