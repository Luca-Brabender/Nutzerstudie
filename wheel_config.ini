# ==============================================================================
# Konfiguration fuer Logitech Racing Wheels (G27 / G29)
# ==============================================================================
# Realistisches Audi-Fahrgefuehl (ISO 26022 LCT bei 60 km/h):
# - 38% sanfte Hardware-Grundzentrierung gegen Ermüdung
# - 65% viskose Lenkdämpfung fuer aperiodischen Ruecklauf (kein Nachschwingen)
# - Reales Pkw-Lenkgetriebe mit Querbeschleunigungs-Feedback in der Software
# - 1.2% Nulllagen-Ruhezone fuer absolut praezises Geradeausfahren
# ==============================================================================

[G27 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5

# Motor- & Feedback-Parameter:
steering_range = 900
overall_gain = 75
autocenter = 38
centering_strength = 38
center_spring = 32
min_force = 7
damping_strength = 65
friction_strength = 14
steering_deadzone = 0.012
anti_clipping = true

[Logitech G27 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 4
handbrake = 5
steering_range = 900
overall_gain = 75
autocenter = 38
centering_strength = 38
center_spring = 32
min_force = 7
damping_strength = 65
friction_strength = 14
steering_deadzone = 0.012
anti_clipping = true

[G29 Racing Wheel]
steering_wheel = 0
throttle = 2
brake = 3
reverse = 5
handbrake = 4
steering_range = 900
overall_gain = 75
autocenter = 38
